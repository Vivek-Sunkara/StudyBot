<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">StudyRAG data analysis tool flow</title>
  <desc id="desc">A four-step flow from CSV upload to safe Python analysis and a versioned modified file.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="1" stop-color="#122b3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55d6be"/>
      <stop offset="1" stop-color="#2aa6c9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#71d7d2"/>
    </marker>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="150" fill="#55d6be" opacity=".08"/>
  <circle cx="100" cy="610" r="190" fill="#2aa6c9" opacity=".07"/>
  <text x="76" y="88" fill="#effdfa" font-family="Georgia,serif" font-size="38" font-weight="700">StudyRAG data tools</text>
  <text x="78" y="124" fill="#9cc4c4" font-family="Arial,sans-serif" font-size="17">Local analysis keeps large datasets out of the LLM context.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="220" width="230" height="220" rx="18" fill="#102b3b" stroke="#27586a"/>
    <rect x="350" y="220" width="230" height="220" rx="18" fill="#102b3b" stroke="#27586a"/>
    <rect x="630" y="220" width="230" height="220" rx="18" fill="#102b3b" stroke="#27586a"/>
    <rect x="910" y="220" width="230" height="220" rx="18" fill="#102b3b" stroke="#27586a"/>
  </g>

  <path d="M306 330h35" stroke="#71d7d2" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M586 330h35" stroke="#71d7d2" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M866 330h35" stroke="#71d7d2" stroke-width="4" marker-end="url(#arrow)"/>

  <g fill="url(#accent)">
    <circle cx="115" cy="268" r="27"/><circle cx="395" cy="268" r="27"/><circle cx="675" cy="268" r="27"/><circle cx="955" cy="268" r="27"/>
  </g>
  <g fill="#06202a" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">
    <text x="115" y="275">1</text><text x="395" y="275">2</text><text x="675" y="275">3</text><text x="955" y="275">4</text>
  </g>
  <g fill="#effdfa" font-family="Arial,sans-serif" font-size="21" font-weight="700">
    <text x="100" y="344">Upload CSV</text>
    <text x="380" y="344">Tool call</text>
    <text x="660" y="344">Python analysis</text>
    <text x="940" y="344">New version</text>
  </g>
  <g fill="#a7c8c9" font-family="Arial,sans-serif" font-size="15">
    <text x="100" y="378">Store the source with</text><text x="100" y="401">a stable file ID.</text>
    <text x="380" y="378">The model requests</text><text x="380" y="401">an approved operation.</text>
    <text x="660" y="378">Pandas handles</text><text x="660" y="401">summary, filters, or groups.</text>
    <text x="940" y="378">Never overwrite the</text><text x="940" y="401">original source file.</text>
  </g>
  <rect x="70" y="510" width="1070" height="64" rx="14" fill="#07151f" stroke="#27586a"/>
  <text x="100" y="550" fill="#71d7d2" font-family="monospace" font-size="17">analyze_data(file_id, operation, parameters)</text>
  <text x="680" y="550" fill="#9cc4c4" font-family="Arial,sans-serif" font-size="16">safe allow-list · 100k row limit · versioned output</text>
</svg>
